name: Auto build Animiru

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-build
  cancel-in-progress: false

env:
  UPSTREAM: animiruorg/Animiru
  BRANCH: animiru-new-main

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.c.outputs.sha }}
      count: ${{ steps.c.outputs.count }}
      new: ${{ steps.c.outputs.new }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --bare --filter=tree:0 --single-branch --branch "$BRANCH" "https://github.com/$UPSTREAM.git" up
          SHA=$(git -C up rev-parse HEAD)
          COUNT=$(git -C up rev-list --count HEAD)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          if gh release view "r$COUNT" --repo "${{ github.repository }}" >/dev/null 2>&1 \
             && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "new=false" >> $GITHUB_OUTPUT
          else
            echo "new=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Punta l'updater al mio fork
        run: |
          FILES=$(grep -rl --include=*.kt 'animiruorg/animiru-preview' . || true)
          if [ -z "$FILES" ]; then echo "Stringa non trovata: la patch va aggiornata"; exit 1; fi
          echo "$FILES" | xargs sed -i 's#animiruorg/animiru-preview#${{ github.repository }}#g'

      - name: Placeholder client_secrets.json
        run: |
          mkdir -p app/src/main/assets
          [ -f app/src/main/assets/client_secrets.json ] || echo '{}' > app/src/main/assets/client_secrets.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew assemblePreview -Pinclude-cast -Penable-updater
        env:
          ANIMIRU_GITHUB_RELEASE: true
          storeFileBase64: ${{ secrets.SIGNING_KEY }}
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="r${{ needs.check.outputs.count }}"
          OUT=app/build/outputs/apk/preview
          ls $OUT
          cp "$OUT/app-universal-preview.apk" "Animiru-$TAG.apk"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            cp "$OUT/app-$abi-preview.apk" "Animiru-$abi-$TAG.apk"
          done
          gh release delete "$TAG" --cleanup-tag --yes --repo "${{ github.repository }}" || true
          gh release create "$TAG" "Animiru-$TAG.apk" \
            --repo "${{ github.repository }}" \
            --title "Animiru $TAG" --latest \
            --notes "Commit upstream: https://github.com/${{ env.UPSTREAM }}/commit/${{ needs.check.outputs.sha }}"
          gh release upload "$TAG" \
            "Animiru-arm64-v8a-$TAG.apk" \
            "Animiru-armeabi-v7a-$TAG.apk" \
            "Animiru-x86-$TAG.apk" \
            "Animiru-x86_64-$TAG.apk" \
            --repo "${{ github.repository }}"
